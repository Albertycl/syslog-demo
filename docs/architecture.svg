<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1375 650" width="1375" height="650"><rect width="1375" height="650" fill="#fff"/><defs><marker id="h" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6b78"/></marker></defs><rect x="176" y="28" width="678" height="190" rx="16" fill="#dcebf1" stroke="#1f6f8b" stroke-width="2"/><text x="192" y="52" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b" text-anchor="start">K3s cluster (namespace syslog-demo)</text><rect x="15" y="80" width="135" height="100" rx="14" fill="#f4f6f8" stroke="#9fb3c0" stroke-width="2"/><text x="82.5" y="108" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Browser</text><text x="82.5" y="129" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">you / interviewer</text><rect x="25" y="140" width="115" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="82.5" y="158" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" font-weight="normal" fill="#3d4b57" text-anchor="middle">syslog.albertycliu.xyz</text><rect x="188" y="80" width="135" height="100" rx="14" fill="#dcebf1" stroke="#1f6f8b" stroke-width="2"/><text x="255.5" y="108" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Traefik</text><text x="255.5" y="129" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">ingress</text><rect x="198" y="140" width="115" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="255.5" y="158" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">HTTPS 443</text><rect x="361" y="80" width="135" height="100" rx="14" fill="#e8f5ec" stroke="#2f9457" stroke-width="2"/><text x="428.5" y="108" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Frontend</text><text x="428.5" y="129" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">nginx + Vue 3</text><rect x="371" y="140" width="115" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="428.5" y="158" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">Service :80</text><rect x="436" y="70" width="52" height="20" rx="10" fill="#2f9457" stroke="#2f9457" stroke-width="1"/><text x="462" y="84" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle">ready</text><rect x="534" y="80" width="135" height="100" rx="14" fill="#e8f5ec" stroke="#2f9457" stroke-width="2"/><text x="601.5" y="108" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Backend</text><text x="601.5" y="129" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">Flask + collector</text><rect x="544" y="140" width="115" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="601.5" y="158" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">Service :5100</text><rect x="609" y="70" width="52" height="20" rx="10" fill="#2f9457" stroke="#2f9457" stroke-width="1"/><text x="635" y="84" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle">ready</text><rect x="707" y="80" width="135" height="100" rx="14" fill="#e8f5ec" stroke="#2f9457" stroke-width="2"/><text x="774.5" y="108" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">MariaDB</text><text x="774.5" y="129" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">database</text><rect x="717" y="140" width="115" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="774.5" y="158" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">StatefulSet + PVC</text><rect x="782" y="70" width="52" height="20" rx="10" fill="#2f9457" stroke="#2f9457" stroke-width="1"/><text x="808" y="84" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle">ready</text><path d="M150,130 L188,130" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="169.0" cy="108" r="13" fill="#5b6b78"/><text x="169.0" y="113" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">7</text><path d="M323,130 L361,130" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="342.0" cy="108" r="13" fill="#5b6b78"/><text x="342.0" y="113" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">8</text><path d="M496,130 L534,130" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="515.0" cy="108" r="13" fill="#5b6b78"/><text x="515.0" y="113" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">9</text><path d="M669,130 L707,130" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="688.0" cy="108" r="13" fill="#5b6b78"/><text x="688.0" y="113" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">10</text><rect x="176" y="308" width="505" height="170" rx="16" fill="#f1ecf8" stroke="#6d4fa3" stroke-width="2"/><text x="192" y="332" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#6d4fa3" text-anchor="start">GitHub (Albertycl)</text><rect x="15" y="328" width="135" height="100" rx="14" fill="#f4f6f8" stroke="#9fb3c0" stroke-width="2"/><text x="82.5" y="356" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Developer</text><text x="82.5" y="377" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">you</text><rect x="25" y="388" width="115" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="82.5" y="406" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">git push</text><rect x="188" y="348" width="135" height="100" rx="14" fill="#dcebf1" stroke="#1f6f8b" stroke-width="2"/><text x="255.5" y="376" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1d2b36" text-anchor="middle">GitHub Actions</text><text x="255.5" y="397" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">test, build</text><rect x="198" y="408" width="115" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="255.5" y="426" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">ci.yml</text><rect x="361" y="348" width="135" height="100" rx="14" fill="#f4f6f8" stroke="#9fb3c0" stroke-width="2"/><text x="428.5" y="376" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">GHCR</text><text x="428.5" y="397" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">image registry</text><rect x="371" y="408" width="115" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="428.5" y="426" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">2 images</text><rect x="534" y="348" width="135" height="100" rx="14" fill="#f4f6f8" stroke="#9fb3c0" stroke-width="2"/><text x="601.5" y="376" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Gitops-apps</text><text x="601.5" y="397" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">manifests only</text><rect x="544" y="408" width="115" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="601.5" y="426" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">syslog-demo/</text><rect x="707" y="348" width="135" height="100" rx="14" fill="#dcebf1" stroke="#1f6f8b" stroke-width="2"/><text x="774.5" y="376" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Argo CD</text><text x="774.5" y="397" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">runs in K3s</text><rect x="717" y="408" width="115" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="774.5" y="426" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">auto sync</text><path d="M150,398 L188,398" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="169.0" cy="376" r="13" fill="#5b6b78"/><text x="169.0" y="381" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><path d="M323,398 L361,398" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="342.0" cy="376" r="13" fill="#5b6b78"/><text x="342.0" y="381" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><path d="M275.5,448 L275.5,470 L601.5,470 L601.5,448" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="428.5" cy="470" r="13" fill="#5b6b78"/><text x="428.5" y="475" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><path d="M707,398 L669,398" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="688.0" cy="376" r="13" fill="#5b6b78"/><text x="688.0" y="381" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><path d="M774.5,348 L774.5,270 L688.0,270 L688.0,218" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="774.5" cy="300" r="13" fill="#5b6b78"/><text x="774.5" y="305" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><path d="M428.5,348 L428.5,270 L342.0,270 L342.0,218" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="428.5" cy="300" r="13" fill="#5b6b78"/><text x="428.5" y="305" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text><rect x="890" y="20" width="470" height="610" rx="16" fill="#f7f9fb" stroke="#dfe5ea" stroke-width="2"/><text x="915" y="52" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1d2b36" text-anchor="start">Steps</text><circle cx="915" cy="81" r="13" fill="#5b6b78"/><text x="915" y="86" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="938" y="86" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">The developer pushes code to the public app</text><text x="938" y="106" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">repo on GitHub.</text><circle cx="915" cy="135" r="13" fill="#5b6b78"/><text x="915" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="938" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">GitHub Actions runs the checks, builds the two</text><text x="938" y="160" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">images and pushes them to GHCR.</text><circle cx="915" cy="189" r="13" fill="#5b6b78"/><text x="915" y="194" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="938" y="194" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">GitHub Actions writes the new image tag into</text><text x="938" y="214" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">Gitops-apps (commit &quot;deploy &lt;sha&gt;&quot;).</text><circle cx="915" cy="243" r="13" fill="#5b6b78"/><text x="915" y="248" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="938" y="248" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">Argo CD reads Gitops-apps and sees the new</text><text x="938" y="268" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">tag.</text><circle cx="915" cy="297" r="13" fill="#5b6b78"/><text x="915" y="302" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="938" y="302" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">Argo CD applies the manifests to the K3s</text><text x="938" y="322" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">cluster (auto sync, self-heal).</text><circle cx="915" cy="351" r="13" fill="#5b6b78"/><text x="915" y="356" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="938" y="356" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">The K3s cluster pulls the images from GHCR.</text><circle cx="915" cy="385" r="13" fill="#5b6b78"/><text x="915" y="390" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">7</text><text x="938" y="390" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">The browser opens</text><text x="938" y="410" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">https://syslog.albertycliu.xyz and Traefik</text><text x="938" y="430" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">receives the request.</text><circle cx="915" cy="459" r="13" fill="#5b6b78"/><text x="915" y="464" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">8</text><text x="938" y="464" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">Traefik sends the request to the frontend</text><text x="938" y="484" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">(nginx serves the Vue pages).</text><circle cx="915" cy="513" r="13" fill="#5b6b78"/><text x="915" y="518" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">9</text><text x="938" y="518" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">The frontend proxies /api to the backend</text><text x="938" y="538" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">(Flask), whose collector makes alerts from</text><text x="938" y="558" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">fake log lines.</text><circle cx="915" cy="587" r="13" fill="#5b6b78"/><text x="915" y="592" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">10</text><text x="938" y="592" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">The backend reads and writes MariaDB, which</text><text x="938" y="612" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">keeps its data on a volume.</text></svg>