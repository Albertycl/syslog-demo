name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/albertycl/syslog-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend import check
        run: |
          pip install -q -r backend/requirements.txt
          (cd backend && DATABASE_URL=sqlite:// python -c "import main_yt_syslog")
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Frontend build check
        run: |
          cd yt_syslog_frontend
          npm ci --no-audit --no-fund
          npx quasar build

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: backend,  context: backend }
          - { name: frontend, context: yt_syslog_frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  update-gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out gitops-apps
        uses: actions/checkout@v4
        with:
          repository: Albertycl/gitops-apps
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops
      - name: Set new image tags
        working-directory: gitops/manifests/syslog-demo
        run: |
          for n in backend frontend; do
            kustomize edit set image \
              ghcr.io/albertycl/syslog-demo-$n=ghcr.io/albertycl/syslog-demo-$n:${{ github.sha }}
          done
      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "syslog-demo: deploy ${GITHUB_SHA::7}"
          git push
